# coding-assistant — Profile 元数据
# 此文件被 harness/config/loader.py 的 ConfigLoader 读取。

[meta]
name = "coding-assistant"
description = "A modular coding assistant with file operations, shell execution, and MCP support."
template = "coding-assistant"
version = "0.1.0"

[modules]
guide_provider = true
memory_backend = true
context_assembler = true
sensor = true
system_tool_provider = true
mcp_adapter = false
